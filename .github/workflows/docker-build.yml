name: Manual Docker build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nginx and httpfin module
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build image
        run: docker build --pull=false -t httpfin:manual-check .

      - name: Check Nginx configuration
        run: |
          docker run --rm --entrypoint sh httpfin:manual-check -c '
            set -eu
            mkdir -p /etc/nginx/certs
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -keyout /etc/nginx/certs/server.key \
              -out /etc/nginx/certs/server.crt \
              -subj "/CN=inspector.example.test" \
              -addext "subjectAltName=DNS:inspector.example.test" \
              >/dev/null 2>&1
            nginx -t
          '
