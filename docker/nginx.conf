user nobody;

load_module /usr/lib/nginx/modules/ngx_http_httpfin_module.so;

events {}

http {
    error_log /dev/stderr notice;
    httpfin_socket /run/httpfin/events.sock;

    log_format httpfin_json escape=json
        '{"request_id":"$httpfin_request_id",'
        '"handoff":"$httpfin_handoff_status",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"sni":"$ssl_server_name",'
        '"alpn":"$ssl_alpn_protocol"}';

    upstream httpfin_backend { server 127.0.0.1:8080; }

    server {
        listen 8443 ssl;
        http2 on;
        server_name inspector.example.test;
        httpfin on;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        access_log /dev/stdout httpfin_json;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://httpfin_backend;
        }
    }
}
