# Include this file from the http {} context.
# It produces one JSON object per completed request for a file tailer or log shipper.

log_format httpfin escape=json
  '{"ts":"$time_iso8601",'
  '"elapsed_ms":$request_time,'
  '"client_ip":"$remote_addr",'
  '"method":"$request_method",'
  '"url":"$request_uri",'
  '"status":$status,'
  '"bytes":$bytes_sent,'
  '"protocol":"$server_protocol",'
  '"tls_version":"$ssl_protocol",'
  '"alpn":"$ssl_alpn_protocol",'
  '"user_agent":"$http_user_agent",'
  '"request_id":"$request_id"}';

# Put inside the relevant server {} or location {} block.
access_log /var/log/nginx/httpfin.jsonl httpfin;

# If Nginx is behind a trusted load balancer, configure real IP explicitly.
# Do not copy this blindly: use only trusted proxy CIDRs.
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;
