# SNI/ALPN preread mode. This does not terminate TLS and does not expose HTTP.
# Include the stream {} block from nginx.conf, not from http {}.

stream {
    # Route by SNI only after validating that the upstream is trusted.
    map $ssl_preread_server_name $httpfin_upstream {
        default api_backend;
        inspector.example.test api_backend;
    }

    log_format httpfin_stream escape=json
      '{"ts":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"server_name":"$ssl_preread_server_name",'
      '"alpn":"$ssl_preread_alpn_protocols",'
      '"protocol":"$protocol",'
      '"bytes_sent":$bytes_sent,'
      '"bytes_received":$bytes_received,'
      '"session_time":$session_time}';

    upstream api_backend { server 127.0.0.1:8443; }

    server {
        listen 443;
        proxy_pass $httpfin_upstream;
        ssl_preread on;
        access_log /var/log/nginx/httpfin-stream.jsonl httpfin_stream;
    }
}
