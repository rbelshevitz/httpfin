[Definition]
# Neutral telemetry for 401/403/429. Keep this jail disabled unless the team
# explicitly wants repeated HTTP denials to participate in host bans.
failregex = ^httpfin-security\s+ts=\S+\s+src=<HOST>\s+event=http_status_denied\s+endpoint=\S+\s+status=(401|403|429)\s+reason=status_\d{3}\s*$
ignoreregex =
