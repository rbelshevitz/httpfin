services:
  httpfin:
    build:
      context: .
      args:
        NGINX_VERSION: "1.28.3"
        ALPINE_VERSION: "3.23"
    environment:
      httpfin_security_log: ${HTTPFIN_SECURITY_LOG:-}
      httpfin_test_endpoint: ${HTTPFIN_TEST_ENDPOINT:-0}
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
